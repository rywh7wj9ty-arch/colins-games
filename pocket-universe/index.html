<!doctype html><html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#000">
<title>Pocket Universe</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#000;color:#eef;font-family:-apple-system,system-ui,Helvetica,sans-serif;overflow:hidden;touch-action:none}
canvas{display:block;position:fixed;inset:0}
.ui{position:fixed;z-index:5}
#top{top:calc(env(safe-area-inset-top) + 8px);left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#era{pointer-events:none}#era h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.5px;text-shadow:0 0 18px rgba(120,180,255,.7)}
#era .when{font-size:12px;opacity:.75;margin-top:2px}
#read{background:rgba(5,8,20,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:7px 9px;font-size:11px;line-height:1.45;min-width:150px;pointer-events:auto}
#read b{color:#9cf;font-weight:600}#read .row{display:flex;justify-content:space-between;gap:8px}
.bar{height:6px;border-radius:3px;display:flex;overflow:hidden;margin-top:4px;background:#222}.bar i{display:block;height:100%}
.leg{font-size:9.5px;opacity:.8;display:flex;gap:6px;margin-top:2px}.leg span:before{content:'';display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:3px;background:var(--c)}
#cap{left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 150px);text-align:center;font-size:15px;line-height:1.4;text-shadow:0 1px 8px #000,0 0 3px #000;opacity:0;transition:opacity .6s;pointer-events:none}
#bottom{left:0;right:0;bottom:0;padding:8px 12px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(transparent,rgba(0,0,0,.75) 40%)}
#ticks{position:relative;height:16px;font-size:9px;opacity:.7}#ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
#scrub{width:100%;-webkit-appearance:none;appearance:none;height:30px;background:transparent}
#scrub::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,#fff,#ffd27a 10%,#ff7a3a 25%,#c43 40%,#311 55%,#225 65%,#48f 80%,#4c8 100%)}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 0 14px #9cf,0 0 3px #000}
#btns{display:flex;gap:6px;overflow-x:auto;padding-top:4px;scrollbar-width:none}#btns::-webkit-scrollbar{display:none}
button{font:inherit;color:#eef;background:rgba(30,40,70,.6);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:8px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
button.on{background:rgba(90,150,255,.55);border-color:#9cf}
#fact{left:12px;right:12px;top:30%;background:rgba(8,12,30,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(150,200,255,.3);border-radius:16px;padding:16px;font-size:14.5px;line-height:1.5;display:none;z-index:9}
#fact h3{margin:0 0 6px;color:#9cf}#fact .x{position:absolute;right:10px;top:8px;background:none;border:0;font-size:20px}
#panel{left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);background:rgba(8,12,30,.9);border:1px solid rgba(150,200,255,.25);border-radius:16px;padding:12px;display:none;z-index:8;font-size:13px}
#panel label{display:block;margin:6px 0}#panel input[type=range]{width:100%}
#plot{width:100%;height:90px;background:#050814;border-radius:8px;margin-top:6px}
#verdict{font-weight:700;font-size:15px;margin-top:6px;color:#ffd27a}
#flyb{right:12px;bottom:calc(env(safe-area-inset-bottom) + 160px);display:none;flex-direction:column;gap:8px}
#flyb button{width:56px;height:56px;border-radius:50%;font-size:22px;padding:0}
#here{position:fixed;z-index:4;pointer-events:none;display:none;transform:translate(-50%,-50%);text-align:center;font-size:12px;font-weight:700;color:#ffef9a;text-shadow:0 0 6px #000}
#here:before{content:'';display:block;margin:0 auto 4px;width:26px;height:26px;border:2px solid #ffef9a;border-radius:50%;box-shadow:0 0 12px #ffef9a;animation:p 1.2s infinite}
@keyframes p{50%{transform:scale(1.4);opacity:.5}}
#shutter{left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);transform:translateX(-50%);width:72px;height:72px;border-radius:50%;background:#fff;border:5px solid #888;display:none;z-index:9}
#pexit{right:14px;top:calc(env(safe-area-inset-top) + 12px);display:none;z-index:9}
#pfx{left:12px;top:calc(env(safe-area-inset-top) + 12px);display:none;z-index:9;gap:6px}
#shot{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px}
#shot img{max-width:100%;max-height:75%;border-radius:12px;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
#load{position:fixed;inset:0;z-index:30;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:15px;letter-spacing:2px;transition:opacity 1s}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:19;transition:opacity .4s}
body.photo .ui:not(#shutter):not(#pexit):not(#pfx){display:none!important}
</style></head><body>
<div id="load"><div style="font-size:28px;font-weight:200;letter-spacing:8px">POCKET UNIVERSE</div><div id="lt" style="opacity:.6;margin-top:12px">Igniting the Big Bang…</div></div>
<div class="ui" id="top"><div id="era"><h1 id="en">The Beginning</h1><div class="when" id="ew"></div></div>
<div id="read"><div class="row"><span>Age</span><b id="rAge"></b></div><div class="row"><span>Temp</span><b id="rT"></b></div><div class="row"><span>Size*</span><b id="rS"></b></div>
<div class="bar"><i id="bM" style="background:#c9a0ff"></i><i id="bR" style="background:#ffcf5a"></i><i id="bL" style="background:#4fd1ff"></i></div>
<div class="leg"><span style="--c:#c9a0ff" id="lM">Matter</span><span style="--c:#ffcf5a" id="lR">Rad.</span><span style="--c:#4fd1ff" id="lL">DE</span></div></div></div>
<div class="ui" id="cap"></div>
<div id="here">You are here</div>
<div class="ui" id="flyb"><button id="fwd">▲</button><button id="back">▼</button></div>
<div class="ui" id="bottom"><div id="ticks"></div><input id="scrub" type="range" min="0" max="1" step="0.0005" value="0">
<div id="btns"><button id="bTour">▶ Tour</button><button id="bHere">📍 You are here</button><button id="bFly">🚀 Fly</button><button id="bSand">⚖️ Sandbox</button><button id="bPhoto">📸 Photo</button><button id="bFact">💡 Facts</button><button id="bAudio">🔇 Sound</button></div></div>
<div class="ui" id="fact"><button class="x" id="fx">✕</button><h3 id="fh"></h3><div id="fb"></div></div>
<div class="ui" id="panel"><div style="display:flex;justify-content:space-between;align-items:center"><b>Universe sandbox — what happens next?</b><button id="sx" style="padding:4px 10px">✕</button></div>
<label>Dark energy strength: <b id="vL">1.0×</b><input type="range" id="sL" min="-1" max="4" step="0.05" value="1"></label>
<label>Dark energy type (w): <b id="vW">−1.00</b><input type="range" id="sW" min="-2" max="-0.4" step="0.02" value="-1"></label>
<label>Gravity / matter strength: <b id="vG">1.0×</b><input type="range" id="sG" min="0.2" max="8" step="0.1" value="1"></label>
<div style="display:flex;gap:6px;flex-wrap:wrap"><button id="pCrunch">Big Crunch</button><button id="pRip">Big Rip</button><button id="pFreeze">Our universe</button><button id="sRun" class="on">▶ Run future</button></div>
<canvas id="plot"></canvas><div id="verdict"></div></div>
<button class="ui" id="shutter"></button><button class="ui" id="pexit">✕ Done</button>
<div class="ui" id="pfx" style="display:none"><button data-f="0" class="on">Natural</button><button data-f="1">Vivid</button><button data-f="2">Mono</button><button data-f="3">Warm</button></div>
<div id="shot"><img id="shotimg" alt="Your photo"><div style="font-size:13px;opacity:.8">Press and hold the image to save it to Photos</div><div style="display:flex;gap:8px"><button id="share">Share</button><button id="shotx">Close</button></div></div>
<div id="flash"></div>
<script>
(function(){var srcs=["https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js","https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js","https://unpkg.com/three@0.134.0/build/three.min.js","three.min.js"],i=0;
function next(){if(window.THREE){var s=document.createElement('script');s.src='app.js?v=1';document.body.appendChild(s);return}if(i>=srcs.length){document.getElementById('lt').textContent='Could not load 3D engine';return}var s=document.createElement('script');s.src=srcs[i++];s.onload=next;s.onerror=next;document.head.appendChild(s)}next()})();
</script></body></html>
