name: TSLA price feed
on:
  schedule: [{cron: '*/10 8-23 * * 1-5'}, {cron: '0 6 * * *'}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tesla-tracker/fetch_prices.py tesla-tracker/data/tsla.json
      - run: |
          git config user.name "price-bot"; git config user.email "price-bot@users.noreply.github.com"
          git add tesla-tracker/data/tsla.json && git commit -m "TSLA price update" && git push || echo "no change"
